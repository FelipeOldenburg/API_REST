<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Eventos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="particles"></canvas>

<h1>🎉 Sistema de Eventos</h1>

<div class="container">

  <div class="box">
    <h2>Registro</h2>
    <input id="name" placeholder="Nome">
    <input id="email" placeholder="Email">
    <input id="password" placeholder="Senha">
    <button onclick="register()">Registrar</button>
  </div>

  <div class="box">
    <h2>Login</h2>
    <input id="emailLogin" placeholder="Email">
    <input id="passwordLogin" placeholder="Senha">
    <button onclick="login()">Login</button>
  </div>

  <div class="box">
    <h2>Criar Evento</h2>
    <input id="title" placeholder="Título">
    <button onclick="createEvent()">Criar</button>
  </div>

  <div class="box">
    <h2>Eventos</h2>
    <button onclick="getEvents()">Listar</button>
    <ul id="list"></ul>
  </div>

</div>

<script>
let token = localStorage.getItem("token") || "";

// -------- API --------
async function register() {
  await fetch('/register', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      name: name.value,
      email: email.value,
      password: password.value
    })
  });
  alert("Registrado!");
}

async function login() {
  const res = await fetch('/login', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      email: emailLogin.value,
      password: passwordLogin.value
    })
  });

  const data = await res.json();
  token = data.token;
  localStorage.setItem("token", token);
  alert("Logado!");
}

async function createEvent() {
  await fetch('/events', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': token
    },
    body: JSON.stringify({
      title: title.value
    })
  });
  alert("Evento criado!");
}

async function getEvents() {
  const res = await fetch('/events');
  const data = await res.json();

  list.innerHTML = "";
  data.forEach(e => {
    const li = document.createElement('li');
    li.innerText = e.title;
    list.appendChild(li);
  });
}

// -------- PARTICULAS --------
const canvas = document.getElementById("particles");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particles = [];

for (let i = 0; i < 80; i++) {
  particles.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    r: Math.random() * 2,
    dx: (Math.random() - 0.5),
    dy: (Math.random() - 0.5)
  });
}

function animate() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  particles.forEach(p => {
    p.x += p.dx;
    p.y += p.dy;

    if (p.x < 0 || p.x > canvas.width) p.dx *= -1;
    if (p.y < 0 || p.y > canvas.height) p.dy *= -1;

    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = "#22c55e";
    ctx.fill();
  });

  requestAnimationFrame(animate);
}

animate();
</script>

</body>
</html>
