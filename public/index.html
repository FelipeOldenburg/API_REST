<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Eventos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="particles"></canvas>

<header class="hero">
  <h1>Gerencie seus eventos</h1>
  <p>Crie, edite e organize tudo em um só lugar</p>
</header>

<div class="container">

  <div class="card">
    <h2>Registro</h2>
    <input id="name" placeholder="Nome">
    <input id="email" placeholder="Email">
    <input id="password" placeholder="Senha">
    <button onclick="register()">Registrar</button>
  </div>

  <div class="card">
    <h2>Login</h2>
    <input id="emailLogin" placeholder="Email">
    <input id="passwordLogin" placeholder="Senha">
    <button onclick="login()">Login</button>
  </div>

  <div class="card">
    <h2>Criar Evento</h2>
    <input id="title" placeholder="Título">
    <button onclick="createEventAPI()">Criar</button>
  </div>

</div>

<div class="events-section">
  <h2>Seus Eventos</h2>
  <button onclick="getEvents()">Atualizar</button>
  <div id="list" class="event-list"></div>
</div>

<script>
let token = localStorage.getItem("token") || "";

// -------- REGISTER --------
async function register() {
  const res = await fetch('/register', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      name: document.getElementById("name").value,
      email: document.getElementById("email").value,
      password: document.getElementById("password").value
    })
  });

  const data = await res.json();

  if (!res.ok) {
    alert(data.error);
    return;
  }

  alert("Registrado!");
}

// -------- LOGIN --------
async function login() {
  const res = await fetch('/login', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      email: document.getElementById("emailLogin").value,
      password: document.getElementById("passwordLogin").value
    })
  });

  const data = await res.json();

  if (!res.ok) {
    alert(data.error);
    return;
  }

  token = data.token;
  localStorage.setItem("token", token);

  alert("Logado!");
}

// -------- CREATE --------
async function createEventAPI() {
  await fetch('/events', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + token
    },
    body: JSON.stringify({
      title: document.getElementById("title").value
    })
  });

  getEvents();
}

// -------- LIST + EDIT + DELETE --------
async function getEvents() {
  const res = await fetch('/events');
  const data = await res.json();

  const list = document.getElementById("list");
  list.innerHTML = "";

  data.forEach(e => {
    const div = document.createElement("div");
    div.className = "event-card";

    div.innerHTML = `
      <span>${e.title}</span>
      <div>
       <button class="edit-btn" onclick="editEvent('${e._id}', '${e.title}')">✏️</button>
<button class="delete-btn" onclick="deleteEvent('${e._id}')">🗑️</button>
      </div>
    `;

    list.appendChild(div);
  });
}

// -------- DELETE --------
async function deleteEvent(id) {
  await fetch('/events/' + id, {
    method: 'DELETE',
    headers: {
      'Authorization': 'Bearer ' + token
    }
  });

  getEvents();
}

// -------- EDIT --------
function editEvent(id, oldTitle) {
  const newTitle = prompt("Novo título:", oldTitle);

  fetch('/events/' + id, {
    method: 'PUT',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + token
    },
    body: JSON.stringify({ title: newTitle })
  }).then(() => getEvents());
}

// -------- PARTICULAS --------
const canvas = document.getElementById("particles");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particles = [];

for (let i = 0; i < 80; i++) {
  particles.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    r: Math.random() * 2,
    dx: (Math.random() - 0.5),
    dy: (Math.random() - 0.5)
  });
}

function animate() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  particles.forEach(p => {
    p.x += p.dx;
    p.y += p.dy;

    if (p.x < 0 || p.x > canvas.width) p.dx *= -1;
    if (p.y < 0 || p.y > canvas.height) p.dy *= -1;

    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = "#4f46e5";
    ctx.fill();
  });

  requestAnimationFrame(animate);
}

animate();
</script>

</body>
</html>
